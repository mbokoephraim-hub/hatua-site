<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" role="img" aria-labelledby="modele-titre modele-desc" font-family="inherit"><title id="modele-titre">Les environnements qui entourent l’adolescent</title><desc id="modele-desc">Schéma en cercles concentriques inspiré du modèle écologique de Bronfenbrenner : au centre, l’adolescent ; autour, la famille, les amis et l’école ; puis le quartier et la communauté ; puis les réseaux sociaux et le numérique ; enfin la culture, les normes et les valeurs.</desc><circle cx="320" cy="320" r="305" fill="#f8e6c6"/><circle cx="320" cy="320" r="250" fill="#f6dcd3"/><circle cx="320" cy="320" r="195" fill="#e8efe9"/><circle cx="320" cy="320" r="140" fill="#f3d3a0"/><circle cx="320" cy="320" r="68" fill="#5c1a16"/><text x="320" y="51" font-size="21" font-weight="600" fill="#2a1512" text-anchor="middle" letter-spacing="0.3">Culture, normes et valeurs</text><text x="320" y="106" font-size="21" font-weight="600" fill="#2a1512" text-anchor="middle" letter-spacing="0.3">Réseaux sociaux et numérique</text><text x="320" y="161" font-size="21" font-weight="600" fill="#2a1512" text-anchor="middle" letter-spacing="0.3">Quartier et communauté</text><text x="320.0" y="222.0" font-size="22" font-weight="700" fill="#5c1a16" text-anchor="middle">Famille</text><text x="410.1" y="378.0" font-size="22" font-weight="700" fill="#5c1a16" text-anchor="middle">Amis</text><text x="229.9" y="378.0" font-size="22" font-weight="700" fill="#5c1a16" text-anchor="middle">École</text><text x="320" y="316" font-size="20" font-weight="700" fill="#fbf4ee" text-anchor="middle">L’adolescent</text><text x="320" y="340" font-size="15" fill="#f3d3a0" text-anchor="middle">et ses choix</text></svg>