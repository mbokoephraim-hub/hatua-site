<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" role="img" aria-labelledby="modele-titre modele-desc" font-family="inherit"><title id="modele-titre">The environments surrounding the adolescent</title><desc id="modele-desc">Concentric circles inspired by Bronfenbrenner’s ecological model: at the centre, the adolescent; around them, family, friends and school; then the neighbourhood and community; then social media and digital life; finally culture, norms and values.</desc><circle cx="320" cy="320" r="305" fill="#f8e6c6"/><circle cx="320" cy="320" r="250" fill="#f6dcd3"/><circle cx="320" cy="320" r="195" fill="#e8efe9"/><circle cx="320" cy="320" r="140" fill="#f3d3a0"/><circle cx="320" cy="320" r="68" fill="#5c1a16"/><text x="320" y="51" font-size="21" font-weight="600" fill="#2a1512" text-anchor="middle" letter-spacing="0.3">Culture, norms and values</text><text x="320" y="106" font-size="21" font-weight="600" fill="#2a1512" text-anchor="middle" letter-spacing="0.3">Social media and digital life</text><text x="320" y="161" font-size="21" font-weight="600" fill="#2a1512" text-anchor="middle" letter-spacing="0.3">Neighbourhood and community</text><text x="320.0" y="212.0" font-size="22" font-weight="700" fill="#5c1a16" text-anchor="middle">Family</text><text x="418.7" y="383.0" font-size="22" font-weight="700" fill="#5c1a16" text-anchor="middle">Friends</text><text x="221.3" y="383.0" font-size="22" font-weight="700" fill="#5c1a16" text-anchor="middle">School</text><text x="320" y="316" font-size="20" font-weight="700" fill="#fbf4ee" text-anchor="middle">Adolescent</text><text x="320" y="340" font-size="15" fill="#f3d3a0" text-anchor="middle">and their choices</text></svg>